# Trent AI Cofounder — Local Development Services
# Usage: docker compose -f docker-compose.dev.yml up -d
version: "3.9"

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: trent-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: trent
      POSTGRES_PASSWORD: trentdev
      POSTGRES_DB: trent
    volumes:
      - trent-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trent"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: trent-redis
    ports:
      - "6379:6379"
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - trent-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: trent-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - trent-minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  trent-postgres-data:
  trent-redis-data:
  trent-minio-data:
