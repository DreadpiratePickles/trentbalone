<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Trent Fleet</title>
    <style>
      /*
       * Tokens are quoted verbatim from 01_discovery/output/style-contract.md.
       * No colour is invented here. Body text is mist, not bone.
       */
      :root {
        --obsidian: #0a0a0f;
        --ink: #11111a;
        --slate: #262633;
        --haze: #4a4a57;
        --mist: #94a3b8;
        --bone: #f1ece2;
        --pulse: #6ee7b7;
        --ember: #fb923c;
        --danger: #f87171;
        --ease: cubic-bezier(0.16, 1, 0.3, 1);
      }
      * { box-sizing: border-box; }
      html, body {
        height: 100%;
        margin: 0;
        background: var(--obsidian);
        color: var(--mist);
        font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        -webkit-font-smoothing: antialiased;
        user-select: none;
      }
      /* Atmosphere grid: 64px lattice, dimmed to a faint field. */
      body::before {
        content: "";
        position: fixed;
        inset: 0;
        background-image:
          linear-gradient(to right, rgba(38, 38, 51, 0.5) 1px, transparent 1px),
          linear-gradient(to bottom, rgba(38, 38, 51, 0.5) 1px, transparent 1px);
        background-size: 64px 64px;
        opacity: 0.35;
        pointer-events: none;
      }
      /* Corner tint: mint top-left, ember bottom-right. */
      body::after {
        content: "";
        position: fixed;
        inset: 0;
        background:
          radial-gradient(60% 55% at 0% 0%, rgba(110, 231, 183, 0.09), transparent 70%),
          radial-gradient(60% 55% at 100% 100%, rgba(251, 146, 60, 0.06), transparent 70%);
        pointer-events: none;
      }
      main {
        position: relative;
        z-index: 1;
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 28px;
      }
      /* HUD frame: dim slate border, mint L-brackets top-left and bottom-right only. */
      .frame {
        position: relative;
        border: 1px solid var(--slate);
        background: var(--ink);
        padding: 44px 60px;
        min-width: 420px;
        text-align: center;
      }
      .frame::before,
      .frame::after {
        content: "";
        position: absolute;
        width: 16px;
        height: 16px;
        border-color: var(--pulse);
        border-style: solid;
      }
      .frame::before { top: -1px; left: -1px; border-width: 1px 0 0 1px; }
      .frame::after { bottom: -1px; right: -1px; border-width: 0 1px 1px 0; }

      .mark {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        font-weight: 900;
        letter-spacing: -0.06em;
        font-size: 30px;
        color: var(--bone);
      }
      .dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: var(--pulse);
        box-shadow: 0 0 14px rgba(110, 231, 183, 0.65);
        animation: breathe 2.4s var(--ease) infinite;
      }
      @keyframes breathe {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.42; transform: scale(0.82); }
      }
      #status {
        margin-top: 22px;
        font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace;
        font-size: 11px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--haze);
      }
      #status[data-tone="error"] { color: var(--danger); }
      #detail {
        margin-top: 12px;
        font-size: 12px;
        line-height: 1.7;
        color: var(--mist);
        max-width: 46ch;
        white-space: pre-wrap;
      }
      /* Fading rule: starts mint, decays to haze, then blank. */
      .rule {
        height: 1px;
        margin-top: 26px;
        background: linear-gradient(to right, var(--pulse), var(--haze) 38%, transparent 78%);
      }
    </style>
  </head>
  <body>
    <main>
      <div class="frame">
        <div class="mark"><span class="dot" aria-hidden="true"></span>trent</div>
        <div id="status">Starting local server</div>
        <div id="detail"></div>
        <div class="rule"></div>
      </div>
    </main>
    <script>
      // The only IPC this page performs, and the only permission the capability
      // grants it: listening for startup progress emitted by the Rust shell.
      // `app.withGlobalTauri` puts the API on `window.__TAURI__`, so this file
      // needs no bundler — there is no frontend build step any more.
      (function () {
        var status = document.getElementById("status");
        var detail = document.getElementById("detail");
        var tauri = window.__TAURI__;
        if (!tauri || !tauri.event) return; // plain browser preview: static copy stands alone
        tauri.event.listen("startup-status", function (event) {
          var payload = event.payload || {};
          status.textContent = payload.message || "Starting local server";
          status.dataset.tone = payload.tone || "";
          detail.textContent = payload.detail || "";
        });
      })();
    </script>
  </body>
</html>
