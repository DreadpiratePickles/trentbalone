[package]
name = "trent-desktop"
version = "1.0.0"
description = "Trent Fleet — AI Cofounder Platform Desktop"
authors = ["Trent Engineering <team@trent.ai>"]
license = "MIT"
edition = "2021"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
tauri = { version = "1.6", features = ["shell-open", "system-tray", "notification", "global-shortcut"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
