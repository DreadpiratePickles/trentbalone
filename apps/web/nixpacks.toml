# Railway nixpacks configuration for trent-ai-cofounder.
#
# aptPkgs installs Chromium's system dependencies at build time so that
# the `[phases.browsers]` step below can run `npx playwright install
# chromium` without --with-deps (which requires sudo and fails in
# Railway's builder).
#
# Playwright detects these libs automatically and downloads only the
# Chromium browser binary into the build layer cache. The browser binary
# is cached at /root/.cache/ms-playwright and persists into the runtime
# image, so the workbench build loop can capture screenshots / run
# interaction checks in production.

[phases.setup]
aptPkgs = [
  "libnss3",
  "libatk1.0-0",
  "libatk-bridge2.0-0",
  "libcups2",
  "libdrm2",
  "libdbus-1-3",
  "libexpat1",
  "libgbm1",
  "libglib2.0-0",
  "libxcb1",
  "libxcomposite1",
  "libxdamage1",
  "libxext6",
  "libxfixes3",
  "libxkbcommon0",
  "libxrandr2",
  "libxss1",
  "libxtst6",
  # Ubuntu 24.04 (noble) renamed libasound2 -> libasound2t64 (64-bit time_t
  # transition). Plain "libasound2" is a virtual package with two providers
  # there, so apt refuses to pick one and the build fails.
  "libasound2t64",
  "libpango-1.0-0",
  "libcairo2",
  "libfontconfig1",
  "libx11-6",
  "libx11-xcb1",
  "libnspr4",
  "libxi6",
  "libxrender1",
  "ca-certificates",
  "fonts-liberation"
]

# Pin the browsers cache to an absolute path. Playwright's default location
# (~/.cache/ms-playwright) is resolved from $HOME, which is not guaranteed to
# be the same string in the Nixpacks build-phase shell as in the runtime
# container process — a mismatch there installs the binary at build time into
# a path the runtime process never looks in, surfacing as "Executable doesn't
# exist" even though the browsers phase ran successfully. Pinning removes the
# ambiguity. This must be a top-level [variables] entry (not just exported in
# a phase cmd) so Nixpacks bakes it into the final image's ENV, not just the
# build shell.
[variables]
PLAYWRIGHT_BROWSERS_PATH = "/root/.cache/ms-playwright"

# Download the Chromium browser binary (and its headless-shell companion,
# installed by default unless --no-shell is passed) after dependencies are
# installed and before `next build`. Without this phase, the browsers cache
# is empty in the runtime image and every workbench screenshot/render/
# interaction check fails with "Executable doesn't exist".
[phases.browsers]
dependsOn = ["install"]
cmds = ["npx playwright install chromium"]

[phases.build]
dependsOn = ["browsers"]
cmds = ["npm run build"]
