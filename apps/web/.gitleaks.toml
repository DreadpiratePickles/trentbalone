# gitleaks configuration for Trent
# Install: brew install gitleaks
# Run:     gitleaks detect --source . --config .gitleaks.toml
# Pre-commit: add to .git/hooks/pre-commit or use pre-commit framework

title = "Trent gitleaks config"

[extend]
useDefault = true

[[rules]]
id = "trent-encryption-key"
description = "Trent SECRET_ENCRYPTION_KEY"
regex = '''SECRET_ENCRYPTION_KEY\s*=\s*["']?[0-9a-fA-F]{60,}'''
tags = ["key", "trent"]

[[rules]]
id = "trent-env-file"
description = "Raw env file committed"
path = '''(^|/)(?:\.env(?:\..*)?|[^/]+\.env(?:\..*)?|[^/]*env\.local|trent\.env\.local)$'''
tags = ["env", "trent"]

[allowlist]
description = "Global allow list"
paths = [
  ".env.example",
  ".gitleaks.toml",
  "vitest.config.ts",   # contains DATABASE_URL pointing to test.db
  "vitest.setup.ts",
  # Scope scanning to first-party application code. The paths below hold fake
  # fixtures / example keys (e.g. ghp_1234567890abcdef, sk_live_abc123) or
  # third-party code, not real Trent secrets:
  '''.*\.test\.tsx?$''',        # unit-test fixtures
  '''(^|/)\.agents/.*''',       # agent skill docs/examples
  '''(^|/)docs/.*''',           # design/planning docs (e.g. credential-boundary) show example creds
  '''(^|/)vendor/.*''',         # vendored third-party code (mem0, LightRAG) and its own telemetry keys
]
regexes = [
  # placeholder values
  '''REPLACE_WITH''',
  '''sk-\.\.\.''',
  '''sk-ant-\.\.\.''',
  '''00000000000000000000000000000000''',
  '''ghp_1234567890abcdef''',  # github.test.ts fixture
  '''sk_live_abc123''',        # api-design SKILL.md example
]
