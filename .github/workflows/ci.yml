# ci.yml — the orchestrator.
#
# Shape borrowed from the good part of Hermes's setup: a `detect` job that classifies the
# changed paths, conditional downstream jobs, and ONE aggregating `all-checks-pass` job that
# `needs:` every other job. Branch protection then requires exactly one check
# ("all-checks-pass") instead of a list that silently rots as jobs are renamed.
#
# WHY THIS PIPELINE EXISTS AT ALL. The single thing we cannot get on one developer Mac is
# running each cross-compiled binary on its real operating system, and running the
# Docker-dependent suites against a real daemon. Those live in binary.yml and sandbox.yml.
#
# NODE VERSION MISMATCH — FLAGGED, NOT PAPERED OVER.
#   apps/web/package.json declares  engines.node = "22.x"
#   the dev machine currently runs  node v26.8.2
# CI pins the DECLARED version (22.x) because that is the contract the package publishes.
# The consequence is that CI and the dev machine are not running the same runtime, so a
# Node-26-only syntax or API will pass locally and fail here. Fix the declaration or fix the
# machine; do not "fix" it by loosening this pin.

name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
  schedule:
    # Nightly at 03:17 UTC. The nightly run forces the live provider tests to be required
    # (TRENT_REQUIRE_LIVE_TESTS=1) so a missing key fails instead of quietly skipping.
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      require_live_tests:
        description: "Force provider-key tests to be required (fail if a key is absent)"
        type: boolean
        default: false

# One in-flight run per ref. Cancel superseded pull-request runs; NEVER cancel a run on the
# default branch, because main's run history is the record of what was actually verified.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least privilege at the top; individual jobs narrow further where they can.
# There is deliberately no `secrets: inherit` anywhere in this repository.
permissions:
  contents: read

env:
  # apps/web/package.json -> engines.node. See the mismatch note above.
  NODE_VERSION: "22.x"
  BUN_VERSION: "1.4.2"
  # Without this every job runs twice and still reports success (~4x the model bill,
  # silently). Measured: 31 worker invocations for a 3-step run. See AGENTS.md.
  TRENT_QUEUE_FALLBACK: disabled

jobs:
  # --------------------------------------------------------------------------------------
  detect:
    name: detect changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      web: ${{ steps.filter.outputs.web }}
      core: ${{ steps.filter.outputs.core }}
      cli: ${{ steps.filter.outputs.cli }}
      binary: ${{ steps.filter.outputs.binary }}
      sandbox: ${{ steps.filter.outputs.sandbox }}
      surfaces: ${{ steps.filter.outputs.surfaces }}
      ci: ${{ steps.filter.outputs.ci }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Classify changed paths
        id: filter
        uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        with:
          # On push events paths-filter diffs against the base commit; on PRs against the
          # base branch. `predicate-quantifier` left at default (some).
          filters: |
            ci:
              - '.github/workflows/**'
              - 'scripts/ci/**'
            web:
              - 'apps/web/**'
              - 'package-lock.json'
              - '.github/workflows/ci.yml'
            core:
              - 'packages/trent-core/**'
              - 'apps/web/prisma/schema.prisma'
              - 'package-lock.json'
              - '.github/workflows/ci.yml'
            cli:
              - 'apps/cli/**'
              - 'packages/trent-core/**'
              - 'package-lock.json'
            binary:
              - 'apps/cli/**'
              - 'packages/trent-core/**'
              - 'scripts/ci/build-binary.sh'
              - 'scripts/ci/verify-binary.mjs'
              - '.github/workflows/binary.yml'
              - 'package-lock.json'
            sandbox:
              - 'packages/trent-core/src/terminal/**'
              - 'packages/trent-core/src/egress/**'
              - 'packages/trent-core/src/doctor/**'
              - '.github/workflows/sandbox.yml'
            surfaces:
              - 'apps/cli/src/**'
              - 'apps/desktop/src/**'
              - 'packages/trent-core/src/**'
              - '01_discovery/output/design-tokens.json'
              - 'scripts/ci/repo-scan.mjs'

  # --------------------------------------------------------------------------------------
  web-tests:
    name: web tests (apps/web)
    # THE GATE. 505 files, 2743 tests, exit 0.
    # NOTE: the ROOT `npx vitest run` is misconfigured — it sweeps apps/web tests without
    # apps/web/vitest.setup.ts and produces two phantom failures (gbrain/server.test.mjs
    # collection error, railway.config.test.ts ENOENT on a relative path). It is NEVER the
    # gate. Only the workspace script below is.
    needs: detect
    if: needs.detect.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install (workspace root, hoisted)
        run: npm ci

      - name: Generate the Prisma client
        # Never cached. A cached Prisma client embeds absolute build-machine paths and goes
        # stale against schema.prisma without any signal that it has.
        run: npm run prisma:generate --workspace=apps/web

      - name: Run the gate
        working-directory: apps/web
        env:
          TRENT_EVAL_SYNC_QUEUE: ""
        run: npm test

  # --------------------------------------------------------------------------------------
  web-typecheck:
    name: web typecheck
    needs: detect
    if: needs.detect.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Generate the Prisma client
        run: npm run prisma:generate --workspace=apps/web
      - name: tsc --noEmit -p tsconfig.typecheck.json
        working-directory: apps/web
        run: npm run typecheck

  # --------------------------------------------------------------------------------------
  core-typecheck:
    name: core typecheck (@trent/core)
    needs: detect
    if: needs.detect.outputs.core == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci

      - name: Derive the SQLite schema and generate the store client
        # packages/trent-core/src/store/generated/ is gitignored derived output. It must be
        # regenerated before typecheck or tests, and it must never be cached.
        run: |
          node packages/trent-core/scripts/derive-sqlite-schema.mjs
          npx prisma generate --schema packages/trent-core/prisma/schema.sqlite.prisma
      - name: Generate the web Prisma client (core imports apps/web/lib)
        run: npm run prisma:generate --workspace=apps/web
      - name: tsc --noEmit
        run: npx tsc --noEmit -p packages/trent-core/tsconfig.json

  # --------------------------------------------------------------------------------------
  core-tests:
    name: core tests (@trent/core + cli)
    needs: detect
    if: needs.detect.outputs.core == 'true' || needs.detect.outputs.cli == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Bun
        id: bun
        # Required for the bun:sqlite store adapter tests. bun:sqlite has no Node equivalent,
        # so packages/trent-core/src/store/store.durability.test.ts shells out to a real bun.
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - run: npm ci

      - name: Derive the SQLite schema and generate the store client
        run: |
          node packages/trent-core/scripts/derive-sqlite-schema.mjs
          npx prisma generate --schema packages/trent-core/prisma/schema.sqlite.prisma
          # The core wrappers import apps/web/lib, whose modules import the WEB app's Prisma
          # client. Without this the suites die with '@prisma/client did not initialize yet'.
          npx prisma generate --schema apps/web/prisma/schema.prisma

      - name: Run the workspace suites
        env:
          # The store tests locate bun through this variable rather than PATH.
          TRENT_BUN_BIN: ${{ steps.bun.outputs.bun-path || 'bun' }}
          TRENT_EVAL_SYNC_QUEUE: ""
        # Scoped to the workspaces. The bare root `npx vitest run` is misconfigured and would
        # drag in apps/web tests without their setup; passing explicit directories keeps the
        # root config from sweeping them.
        run: npx vitest run packages/trent-core apps/cli

  # --------------------------------------------------------------------------------------
  lint:
    name: lint
    needs: detect
    if: needs.detect.outputs.web == 'true' || needs.detect.outputs.cli == 'true' || needs.detect.outputs.core == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Generate both Prisma clients
        # apps/cli/tsconfig.json maps `@/*` onto apps/web, so the CLI typecheck pulls in
        # apps/web/lib modules that import the web app's generated `@prisma/client` (and the
        # core store imports the derived SQLite client). Without either generated client tsc
        # sees the uninitialised stub and reports dozens of implicit-any / missing-export
        # errors in read-only apps/web files that pass the web typecheck. Same recipe as
        # core-typecheck; never cached (absolute build-machine paths, silently stale).
        run: |
          node packages/trent-core/scripts/derive-sqlite-schema.mjs
          npx prisma generate --schema packages/trent-core/prisma/schema.sqlite.prisma
          npm run prisma:generate --workspace=apps/web
      # apps/web has no ESLint config, so `next lint` prompts interactively to create one and
      # exits 1 under CI. `next lint` is also deprecated. The web app's own quality gate is its
      # test suite and typecheck, both run above. Lint here covers OUR code: a typecheck of the
      # CLI and core, which is what actually catches mistakes in TypeScript.
      - name: typecheck apps/cli
        run: npx tsc --noEmit -p apps/cli/tsconfig.json

  # --------------------------------------------------------------------------------------
  anti-pattern-scan:
    name: anti-pattern repo scan
    # The three checklist assertions that are pure repo scans: no canned-string literals,
    # no hex colour outside 01_discovery/output/design-tokens.json, no emoji in CLI output.
    # No baseline file exists by design — a suppression list is how a rule like this dies.
    needs: detect
    if: needs.detect.outputs.surfaces == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Scan the surfaces
        run: node scripts/ci/repo-scan.mjs
      - name: Guard the banned bundler external flag
        run: bash scripts/ci/assert-no-external.sh

  # --------------------------------------------------------------------------------------
  installer-render:
    name: installer render from a clean checkout
    # release.yml (preflight) and pages.yml (build) both start by rendering the installers from
    # scripts/installer/ and comparing them with the committed scripts/install.sh and install.ps1.
    # Those two workflows run only on tag day, so a missing input used to surface there first: the
    # ECDSA public key was gitignored by `*.pem`, and render.sh exited 2 on every clean checkout
    # (05_release/output/public-readiness-audit-2026-09-25.md, section 1.3). Unconditional on
    # purpose: it needs no install, takes seconds, and a stale render can come from any path.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Public keys committed, private keys not
        # The same assertions release.yml's preflight makes, so tag day cannot be the first run.
        run: |
          set -euo pipefail
          test -s scripts/installer/keys/minisign.pub
          test -s scripts/installer/keys/ecdsa-p256.pub.pem
          tracked=$(git ls-files scripts/installer/keys/minisign.key scripts/installer/keys/ecdsa-p256.key.pem)
          if [ -n "$tracked" ]; then
            echo "::error::a private signing key is tracked by git: $tracked"; exit 1
          fi

      - name: Rendered installers match the committed copies
        run: sh scripts/installer/render.sh --check

  # --------------------------------------------------------------------------------------
  binaries:
    name: binaries
    # Cross-compile on one runner, then RUN each artifact on its own native OS.
    # A build-only job would not catch the failure this whole pipeline exists to catch.
    needs: detect
    if: needs.detect.outputs.binary == 'true'
    uses: ./.github/workflows/binary.yml
    permissions:
      contents: read
    # No `secrets:` mapping and no `secrets: inherit`. This workflow needs none.

  # --------------------------------------------------------------------------------------
  sandbox:
    name: sandbox
    # The Docker-dependent suites. These CANNOT pass on the dev machine: the daemon is not
    # running there (`docker info` -> exit 1), so they skip locally and are only ever
    # actually executed here, against a real daemon on a Linux runner.
    needs: detect
    if: needs.detect.outputs.sandbox == 'true' || needs.detect.outputs.core == 'true'
    uses: ./.github/workflows/sandbox.yml
    permissions:
      contents: read

  # --------------------------------------------------------------------------------------
  live-gate:
    name: live provider tests - gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      should_run: ${{ steps.gate.outputs.should_run }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Decide whether live tests run
        id: gate
        env:
          # Declared explicitly, one at a time. Never `secrets: inherit`.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          # Nightly and an explicit dispatch make the live tests MANDATORY, so a missing key
          # fails the gate instead of degrading the nightly into a no-op that looks green.
          TRENT_REQUIRE_LIVE_TESTS: >-
            ${{ (github.event_name == 'schedule' || inputs.require_live_tests) && '1' || '' }}
        run: node scripts/ci/live-tests-gate.mjs

  live-provider-tests:
    name: live provider tests
    # `if:`-gated on purpose. When no key is configured GitHub renders this job as SKIPPED
    # (grey), never as SUCCESS (green). An unproven capability must not look proven.
    needs: [detect, live-gate]
    if: needs.live-gate.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Run the suites that require a real provider
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TRENT_REQUIRE_LIVE_TESTS: "1"
          # The switch vitest.config.ts reads. Until 2026-09-26 this job set a differently spelled
          # variable, ran zero live tests and reported success; ci-workflow-truth.test.ts pins the name.
          TRENT_TEST_LIVE: "1"
        run: npx vitest run packages/trent-core --testNamePattern="live|real gateway"

  # --------------------------------------------------------------------------------------
  all-checks-pass:
    name: all-checks-pass
    # THE ONE REQUIRED CHECK. Point branch protection here and nowhere else.
    #
    # `if: always()` so this job still runs when an upstream job fails or is skipped, and the
    # body distinguishes the two: `skipped` and `success` are acceptable, anything else is
    # not. Without the explicit body a skipped dependency would make this job "succeed"
    # vacuously — the classic way an aggregating gate becomes decorative.
    needs:
      - detect
      - web-tests
      - web-typecheck
      - core-typecheck
      - core-tests
      - lint
      - anti-pattern-scan
      - installer-render
      - binaries
      - sandbox
      - live-gate
      - live-provider-tests
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Assert every upstream job succeeded or was legitimately skipped
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          echo "$RESULTS" > results.json
          python3 - <<'PY'
          import json, sys
          results = json.load(open("results.json"))
          ok, bad = [], []
          for name, data in sorted(results.items()):
              r = data.get("result")
              (ok if r in ("success", "skipped") else bad).append(f"{name}: {r}")
          print("## upstream job results\n")
          for line in ok + bad:
              print("  " + line)
          if bad:
              print("\nall-checks-pass FAILED:")
              for line in bad:
                  print("  " + line)
              sys.exit(1)
          print("\nall-checks-pass: OK")
          PY
