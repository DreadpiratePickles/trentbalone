version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/New_York
    open-pull-requests-limit: 10
    groups:
      dev-dependencies:
        dependency-type: development
      prisma:
        patterns: ["@prisma/*", "prisma"]
      next:
        patterns: ["next", "react", "react-dom"]
